# 冒煙測試：每次 PR 與推上 main 時自動跑，擋下三類最常見的回歸——
#   ① 載入或切頁時 Console 有錯　② 手機版出現左右滑動　③ 金額口徑／儲存格式行為改變
# 系統本身不需要建置，這個流程只安裝測試用的 playwright。
name: 冒煙測試

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'beta.html'
      - 'beta.js'
      - 'test.html'
      - 'tools/build-beta.py'
      - 'tests/**'
      - 'tools/golden/**'
      - 'calc/**'
      - 'package.json'
      - '.github/workflows/smoke.yml'
  push:
    branches: [main, 'claude/**']   # 推 main 一律跑（健檢3 🔴1：部署要等測試通過）；改版第 0 步：推工作分支也跑
  workflow_dispatch:

# 健檢3 🔴1：網站改成「冒煙測試通過才部署」。
# 啟用方式（一次）：GitHub → Settings → Pages → Source 改「GitHub Actions」，
# 再到 Settings → Secrets and variables → Actions → Variables 新增 PAGES_FROM_ACTIONS＝true。
# 還沒啟用前 deploy 工作會跳過，網站照舊由分支直接部署（行為不變）。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 11/11：GitHub runner 連不到 archive.ubuntu.com（DNS 暫時失敗）超過 1.5 小時，裝瀏覽器那一步失敗、測試沒跑到。
      #   ① 瀏覽器快取（key 跟著 package.json 的 playwright 版本走，升級就換新快取）
      #   ② 每一步重試（間隔 30／60 秒）；走 apt 的每次最多 6 分鐘（DNS 不通時 apt 會卡很久，不然 40 分鐘工作上限會先到）
      #   ③ apt 一直不通的退路：改用 Playwright 自己的 CDN 下載瀏覽器（不走 apt），系統套件用 runner 本來裝好的；
      #      缺套件就讓測試自己紅（測試一項都不跳過）
      - name: 快取 playwright 瀏覽器（＋退路下載的字型）
        id: pwcache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.local/share/fonts/fydeb
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 安裝 playwright 與 chromium
        env:
          PW_HIT: ${{ steps.pwcache.outputs.cache-hit }}
        run: |
          retry() { n=$1; shift; for i in $(seq 1 "$n"); do "$@" && return 0; [ "$i" = "$n" ] && return 1; echo "第 $i 次失敗，$((i*30)) 秒後重試：$*"; sleep $((i*30)); done; }
          # 退路的字型：跟 --with-deps 裝的同一組字型套件（中文 wqy-zenhei 等），改從 Debian 映像站下載、解開放到使用者字型資料夾（不走 apt）
          debfonts() {
            mkdir -p ~/.local/share/fonts/fydeb /tmp/fdeb/x
            for pair in fonts-wqy-zenhei:fonts-wqy-zenhei fonts-ipafont-gothic:fonts-ipafont fonts-freefont-ttf:fonts-freefont fonts-liberation:fonts-liberation fonts-noto-color-emoji:fonts-noto-color-emoji fonts-tlwg-loma-otf:fonts-tlwg fonts-unifont:unifont; do
              b=${pair%%:*}; src=${pair##*:}; u="https://deb.debian.org/debian/pool/main/${src:0:1}/$src/"
              f=$(curl -fsSL --retry 3 "$u" | grep -o "${b}_[^\"]*_all\.deb" | sort -V | tail -1) || f=""
              if [ -n "$f" ] && curl -fsSL --retry 3 -o "/tmp/fdeb/$f" "$u$f" && dpkg-deb -x "/tmp/fdeb/$f" /tmp/fdeb/x; then echo "字型 $b：$f"; else echo "::warning::字型 $b 下載失敗"; fi
            done
            find /tmp/fdeb/x -type f \( -name '*.ttf' -o -name '*.ttc' -o -name '*.otf' \) -exec cp {} ~/.local/share/fonts/fydeb/ \;
            fc-cache -f >/dev/null 2>&1 || true
            echo "退路字型 $(ls ~/.local/share/fonts/fydeb | wc -l) 個檔"
          }
          retry 4 npm install --no-audit --no-fund
          if [ "$PW_HIT" = "true" ]; then
            echo "瀏覽器快取命中，只補系統套件"
            if ! retry 2 timeout 360 npx playwright install-deps chromium; then
              echo "::warning::apt 不通，改用 runner 內建系統套件"
              [ -n "$(ls ~/.local/share/fonts/fydeb 2>/dev/null)" ] && fc-cache -f >/dev/null 2>&1 || debfonts
            fi
            retry 4 npx playwright install chromium
          else
            if ! retry 2 timeout 360 npx playwright install --with-deps chromium; then
              echo "::warning::apt 不通，改用 runner 內建系統套件"
              retry 4 npx playwright install chromium
              debfonts
            fi
          fi

      # 測試失敗也先把瀏覽器（和退路字型）存進快取，下一次不用重新下載
      - name: 存瀏覽器快取
        if: steps.pwcache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cache/ms-playwright
            ~/.local/share/fonts/fydeb
          key: pw-${{ runner.os }}-${{ hashFiles('package.json') }}

      - name: 計算模組（Node 單獨跑，不開瀏覽器）
        run: npm run calc

      - name: 語法檢查（雲端程式 functions、計算模組、app.js；部署前就要能解析）
        run: for f in functions/*.js functions/*/*.js calc/*.js app.js sw.js beta.js; do node --check "$f" || exit 1; done

      - name: 雲端程式單元測試（functions/test，純邏輯、不連網）
        run: cd functions && node ../tools/copy-calc.js && node --test test/*.test.js

      - name: 執行冒煙測試
        run: npm test

      - name: 執行合成樣本（健檢 1 每種算錢情境，假資料）
        run: npm run synth

      - name: 合成樣本反向驗證（故意改壞一處金額算法，樣本必須變紅）
        run: node tests/synthetic.js --selftest

      - name: 單據列印指紋（改版第 7 步：報價、請款、詢價單、合約書、保留款退還單印出來一字不差；同一份資料重跑 10 次都要一樣）
        run: npm run docs -- --repeat 10

      - name: 健檢 3 安全網（同步合併、衍生應付重跑、備份來回、包裝白名單）＋反向驗證
        run: |
          npm run safety
          node tests/safety.js --selftest

      - name: 真實黃金樣本工具自我檢查（假資料跑一遍擷取、去識別化、比對）
        run: npm run golden

  deploy:
    needs: smoke
    # 2026-11-07：GitHub Pages 發布卡住時，可在 Actions 對 main 手動 Run workflow 重新發布（同一次重跑會撞到兩份 github-pages 檔案）
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.PAGES_FROM_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 整理要上線的檔案（與分支部署相同內容，排除 .git／.github）
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'node_modules' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: dep
        uses: actions/deploy-pages@v4
