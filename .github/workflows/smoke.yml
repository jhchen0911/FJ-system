# 冒煙測試：每次 PR 與推上 main 時自動跑，擋下三類最常見的回歸——
#   ① 載入或切頁時 Console 有錯　② 手機版出現左右滑動　③ 金額口徑／儲存格式行為改變
# 系統本身不需要建置，這個流程只安裝測試用的 playwright。
name: 冒煙測試

on:
  pull_request:
    paths:
      - 'index.html'
      - 'app.js'
      - 'sw.js'
      - 'beta.html'
      - 'beta.js'
      - 'test.html'
      - 'tools/build-beta.py'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/smoke.yml'
  push:
    branches: [main, 'claude/**']   # 推 main 一律跑（健檢3 🔴1：部署要等測試通過）；改版第 0 步：推工作分支也跑
  workflow_dispatch:

# 健檢3 🔴1：網站改成「冒煙測試通過才部署」。
# 啟用方式（一次）：GitHub → Settings → Pages → Source 改「GitHub Actions」，
# 再到 Settings → Secrets and variables → Actions → Variables 新增 PAGES_FROM_ACTIONS＝true。
# 還沒啟用前 deploy 工作會跳過，網站照舊由分支直接部署（行為不變）。
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 安裝 playwright 與 chromium
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chromium

      - name: 執行冒煙測試
        run: npm test

      - name: 執行合成樣本（健檢 1 每種算錢情境，假資料）
        run: npm run synth

      - name: 合成樣本反向驗證（故意改壞一處金額算法，樣本必須變紅）
        run: node tests/synthetic.js --selftest

  deploy:
    needs: smoke
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.PAGES_FROM_ACTIONS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: 整理要上線的檔案（與分支部署相同內容，排除 .git／.github）
        run: |
          mkdir -p _site
          rsync -a --exclude '.git' --exclude '.github' --exclude '_site' --exclude 'node_modules' ./ _site/
          touch _site/.nojekyll

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: dep
        uses: actions/deploy-pages@v4
